openapi: 3.2.1

info:
  title: Payment API
  version: 1.0.1
  description: >
    Enterprise API contract for managing payment lifecycle states
    and settlement operations.

paths:

  /v1/payments/{paymentId}/settle:
    post:
      summary: Settle a payment
      operationId: settlePayment

      parameters:
        - $ref: '#/components/parameters/PaymentId'

      responses:

        '200':
          description: Payment successfully settled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettledPayment'

        '409':
          description: >
            The payment cannot be settled because its current
            state does not permit settlement.
          content:
            application/problem+json:
              schema:
               # $ref: '#/components/schemas/ProblemDetails'
                $ref: '#/componente/schemas/Errors'

        '422':
          description: >
            The settlement request is syntactically valid but
            cannot be processed because the supplied data violates
            the API's validation constraints.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

        '503':
          description: >
            A required settlement dependency is temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'


components:

  parameters:

    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string


  schemas:

    # ------------------------------------------------------------
    # Payment state model
    # ------------------------------------------------------------

    Payment:
      oneOf:
        - $ref: '#/components/schemas/UnsettledPayment'
        - $ref: '#/components/schemas/SettledPayment'
        - $ref: '#/components/schemas/FailedPayment'

      discriminator:
        propertyName: status
        mapping:
          UNSETTLED: '#/components/schemas/UnsettledPayment'
          SETTLED: '#/components/schemas/SettledPayment'
          FAILED: '#/components/schemas/FailedPayment'


    UnsettledPayment:
      type: object
      required:
        - id
        - status
        - amount
        - currency

      properties:
        id:
          type: string

        status:
          const: UNSETTLED

        amount:
          type: number
          exclusiveMinimum: 0

        currency:
          type: string
          enum:
            - NGN
            - USD


    SettledPayment:
      type: object
      required:
        - id
        - status
        - amount
        - currency
        - settledAt

      properties:
        id:
          type: string

        status:
          const: SETTLED

        amount:
          type: number
          exclusiveMinimum: 0

        currency:
          type: string
          enum:
            - NGN
            - USD

        settledAt:
          type: string
          format: date-time


    FailedPayment:
      type: object
      required:
        - id
        - status
        - amount
        - currency
        - failedAt

      properties:
        id:
          type: string

        status:
          const: FAILED

        amount:
          type: number
          exclusiveMinimum: 0

        currency:
          type: string
          enum:
            - NGN
            - USD

        failedAt:
          type: string
          format: date-time


    # ------------------------------------------------------------
    # RFC 9457 Problem Details
    # ------------------------------------------------------------

    ProblemDetails:
      type: object

      required:
        - type
        - title
        - status
        #- detail
        #- instance

      properties:

        type:
          type: string
          format: uri
          description: >
            URI identifying the type of problem.

        title:
          type: string
          description: >
            Short, human-readable summary of the problem type.

        status:
          type: integer
          minimum: 400
          maximum: 599
          description: >
            HTTP status code generated by the origin server.

        detail:
          type: string
          description: >
            Human-readable explanation specific to this occurrence
            of the problem.

        instance:
          type: string
          format: uri
          description: >
            URI identifying the specific occurrence of the problem.
